<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Farmácia Básica de Montadas — Demonstração</title>
<style>

:root{
  --bg:#f3f7f9;--card:#ffffff;--tx:#13233d;--mu:#63718a;--pr:#0e7c72;--pr2:#075e59;
  --side1:#075a56;--side2:#004d4b;--accent:#2fb59f;--bd:#dfe8ee;--er:#cf2e2e;--erb:#fff0f0;
  --ok:#087a5e;--okb:#e4f8f0;--wa:#b95b00;--wab:#fff5d8;--info:#1f6ed4;--infob:#eaf2ff;
  --shadow:0 12px 34px rgba(27,59,86,.08);--shadow2:0 8px 20px rgba(17,52,74,.07)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(135deg,#f7fafc 0%,#eef5f7 100%);color:var(--tx);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit}
.app{min-height:100vh;display:grid;grid-template-columns:292px 1fr}
.side{background:linear-gradient(180deg,var(--side1) 0%,var(--side2) 100%);color:#fff;padding:18px 14px 22px;position:sticky;top:0;height:100vh;overflow:auto;box-shadow:16px 0 36px rgba(0,65,62,.12);z-index:12}
.side:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 10% 0%,rgba(76,210,188,.18),transparent 30%),linear-gradient(135deg,rgba(255,255,255,.04),transparent 45%);pointer-events:none}
.brand{position:relative;margin:-18px -14px 12px;padding:0 28px 18px;border-bottom:1px solid rgba(255,255,255,.14)}
.crest-wrap{display:block;height:182px;margin:0 -28px 3px;overflow:hidden;background:transparent;box-shadow:none}
.crest-wrap img{display:block;width:292px;height:182px;max-width:none;object-fit:cover;object-position:left top;filter:none}
.brand h1{font-size:1.45rem;line-height:1.12;margin:0;font-weight:800;letter-spacing:-.025em;position:relative}
.brand p{font-size:.86rem;margin:8px 0 0;opacity:.84;position:relative;line-height:1.35}
.demo{position:relative;background:linear-gradient(135deg,#fff5ca,#fff0b5);color:#9b3e0a;border:1px solid #f9dc72;border-radius:12px;padding:10px 12px;font-size:.78rem;margin:14px 4px 16px;box-shadow:0 8px 18px rgba(255,193,7,.08)}
.demo b{display:block;font-size:.76rem;letter-spacing:.035em;margin-bottom:2px}
.nav{position:relative}
.nav button{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:0;background:transparent;color:#dcefed;padding:11px 13px;border-radius:12px;margin:4px 0;cursor:pointer;transition:.18s ease}
.nav button:hover{background:rgba(255,255,255,.08);transform:translateX(2px);color:#fff}
.nav button.on{background:linear-gradient(90deg,rgba(63,200,175,.38),rgba(60,183,163,.22));box-shadow:inset 0 0 0 1px rgba(114,229,210,.15),0 8px 16px rgba(0,0,0,.08);font-weight:750;color:#fff}
.nav svg{width:21px;height:21px;stroke:currentColor;flex:0 0 auto}
.content{min-width:0}
.top{background:rgba(255,255,255,.93);backdrop-filter:blur(12px);border-bottom:1px solid #e7edf1;padding:12px 26px;display:flex;align-items:center;justify-content:space-between;gap:14px;position:sticky;top:0;z-index:8;min-height:74px}
.top-left{display:flex;align-items:center;gap:13px}.title-wrap{display:flex;flex-direction:column}.top h2{margin:0;font-size:1.45rem;line-height:1.15;letter-spacing:-.025em}.top small{color:var(--mu);font-size:.88rem;margin-top:3px}
.top-right{display:flex;align-items:center;gap:10px}.top-icon{width:40px;height:40px;border:1px solid #e5edf1;background:#f8fbfc;border-radius:50%;display:grid;place-items:center;color:#567}.top-icon svg{width:20px;height:20px}
main{max-width:1500px;margin:0 auto;padding:20px 24px 34px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{background:rgba(255,255,255,.97);border:1px solid var(--bd);border-radius:16px;padding:17px;margin-bottom:16px;box-shadow:var(--shadow2)}
.card h3{font-size:1.05rem;letter-spacing:-.01em;color:#173152}
.kpi{padding:16px}.kpi b{font-size:1.9rem;display:block;line-height:1.1}.kpi span{color:var(--mu);font-size:.84rem}
.kpi-card{position:relative;overflow:hidden;min-height:112px;padding:17px 18px;display:flex;align-items:center;gap:14px}
.kpi-card:after{content:"";position:absolute;width:120px;height:120px;border-radius:50%;right:-55px;top:-60px;background:var(--kpiGlow,rgba(18,124,114,.08))}
.kpi-icon{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;flex:0 0 auto;background:var(--kpiBg,#e9f8f4);color:var(--kpiColor,var(--pr))}.kpi-icon svg{width:27px;height:27px;stroke-width:2}
.kpi-copy{min-width:0}.kpi-copy span{display:block;color:#60708a;font-size:.85rem;margin-bottom:5px}.kpi-copy b{display:block;font-size:1.8rem;line-height:1;color:#10223e}.kpi-arrow{margin-left:auto;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--kpiBg,#e9f8f4);color:var(--kpiColor,var(--pr));font-size:1.15rem}
h3{font-size:1rem;margin:0 0 10px}h4{margin:14px 0 8px}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:11px}.row.tight{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
label{display:block;color:#556780;font-size:.82rem;font-weight:650;margin:9px 0 5px}
input,select,textarea{width:100%;border:1px solid #d8e3e8;background:#fbfdfe;color:var(--tx);border-radius:10px;padding:10px 11px;outline:none;transition:.15s ease}
input:focus,select:focus,textarea:focus{border-color:#65bfb1;box-shadow:0 0 0 3px rgba(32,157,141,.12);background:#fff}
textarea{min-height:76px;resize:vertical}
.btn{border:0;background:linear-gradient(135deg,#11877a,#087066);color:#fff;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;box-shadow:0 6px 14px rgba(14,124,114,.16);transition:.16s ease}.btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(14,124,114,.22)}.btn.sec{background:#fff;color:#23405d;border:1px solid #d8e3e8;box-shadow:none}.btn.danger{background:linear-gradient(135deg,#df4545,#bb2424)}.btn.sm{padding:6px 9px;font-size:.79rem;border-radius:8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.tw{overflow:auto;border:1px solid #e0e8ed;border-radius:12px;background:#fff}table{border-collapse:collapse;width:100%;font-size:.84rem}th,td{padding:10px 11px;border-bottom:1px solid #e8eef2;text-align:left;vertical-align:top;white-space:nowrap}th{background:#f4f8fa;color:#51637b;font-weight:750}tbody tr:hover td{background:#fbfdfe}tr:last-child td{border-bottom:0}
.tag{display:inline-block;padding:3px 8px;border-radius:999px;font-size:.72rem;font-weight:750}.good{background:var(--okb);color:var(--ok)}.low{background:var(--erb);color:var(--er)}.warn{background:var(--wab);color:var(--wa)}.info{background:var(--infob);color:var(--info)}
.msg{padding:11px 12px;border-radius:10px;margin-top:10px;font-weight:600}.msg.ok{background:var(--okb);color:var(--ok)}.msg.er{background:var(--erb);color:var(--er)}.msg.wa{background:var(--wab);color:var(--wa)}.hint{color:var(--mu);font-size:.82rem}.search{max-width:420px}
.barrow{display:grid;grid-template-columns:minmax(120px,1fr) 3fr 44px;gap:8px;align-items:center;margin:8px 0}.bar{height:10px;background:#e8efed;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#12897b,#4cc7b5);border-radius:99px}
.modal{position:fixed;inset:0;background:rgba(10,26,37,.55);display:flex;align-items:center;justify-content:center;padding:18px;z-index:30;backdrop-filter:blur(4px)}.modal .box{background:#fff;border-radius:18px;max-width:660px;width:100%;max-height:90vh;overflow:auto;padding:20px;box-shadow:0 24px 70px rgba(3,20,32,.24)}.modal h3{font-size:1.1rem}.empty{text-align:center;color:var(--mu);padding:24px}.split{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.barcode{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.mobilebar{display:none}.pill{display:inline-flex;align-items:center;gap:7px;background:#e9f7f4;color:#07685f;padding:8px 12px;border-radius:999px;font-size:.8rem;font-weight:750;border:1px solid #d1eee8}.notice{display:flex;align-items:center;gap:11px;border-left:4px solid #cc5f00;background:linear-gradient(90deg,#fff8df,#fff2c6);padding:12px 14px;border-radius:10px;margin-bottom:16px;color:#a5480c;box-shadow:0 4px 14px rgba(196,113,7,.05)}
.notice:before{content:"!";width:27px;height:27px;border-radius:50%;display:grid;place-items:center;font-weight:900;background:#f2a145;color:white;flex:0 0 auto}
.dash-layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(330px,.95fr);gap:16px;margin-top:16px}.dash-panel{padding:18px}.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}.panel-title{display:flex;gap:10px;align-items:flex-start}.panel-title svg{width:24px;height:24px;color:var(--pr);margin-top:2px}.panel-title h3{margin:0;font-size:1.12rem}.panel-title p{margin:2px 0 0;color:var(--mu);font-size:.84rem}.mini-link{border:1px solid #dce6ec;background:#fff;color:#0b6a62;font-weight:750;border-radius:9px;padding:7px 10px;cursor:pointer}
.chart-bars{height:235px;display:flex;align-items:flex-end;gap:18px;padding:20px 8px 0;border-bottom:1px solid #dfe7eb;background:linear-gradient(to top,rgba(214,226,233,.35) 1px,transparent 1px);background-size:100% 46px}.chart-item{flex:1;min-width:52px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:8px}.chart-bar{width:min(76%,78px);min-height:6px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,#4ecab7,#209c8d);box-shadow:0 8px 18px rgba(32,156,141,.16);position:relative}.chart-bar:after{content:attr(data-v);position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-size:.75rem;font-weight:750;color:#345}.chart-label{text-align:center;font-size:.75rem;color:#42546a;line-height:1.15;min-height:36px;max-width:115px;overflow:hidden}
.alert-stack{display:flex;flex-direction:column;gap:10px}.alert-box{display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px}.alert-box.red{background:#fff0f0;color:#b51d1d}.alert-box.amber{background:#fff5d7;color:#a84d00}.alert-icon{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.72);flex:0 0 auto}.alert-icon svg{width:22px;height:22px}.alert-box b{display:block;margin-bottom:2px}.alert-box small{color:#6a5c57}.alert-next{margin-left:auto;width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.72);cursor:pointer}
.recent-card{margin-top:16px}.recent-card .tw{border-radius:11px}.section-icon{display:inline-grid;place-items:center;width:28px;height:28px;color:var(--pr)}.section-icon svg{width:24px;height:24px}
@media(max-width:1120px){.app{grid-template-columns:250px 1fr}.side{padding-left:10px;padding-right:10px}.brand h1{font-size:1.2rem}.dash-layout{grid-template-columns:1fr}.grid4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none;position:fixed;z-index:20;width:286px}.side.open{display:block}.mobilebar{display:grid;place-items:center;width:40px;height:40px;padding:0}.grid4{grid-template-columns:repeat(2,1fr)}.top{padding:10px 13px}main{padding:14px}.top-right .top-icon{display:none}.crest-wrap{height:130px}}
@media(max-width:620px){.grid4,.grid2{grid-template-columns:1fr}.barrow{grid-template-columns:1fr}.hide-sm{display:none}.top h2{font-size:1.18rem}.pill{display:none}.chart-bars{gap:8px;height:210px}.chart-label{font-size:.68rem}.kpi-card{min-height:96px}.dash-layout{display:block}}
@media print{.side,.top,.no-print,.btn{display:none!important}.app{display:block}main{max-width:none}.card{box-shadow:none}}

</style>
</head>

function quickPac(c){modal(`<h3>Cadastro rápido do paciente</h3><p>CPF: <b>${fmtCpf(c)}</b></p><label>Nome</label><input id="qpN"><div class="row"><div><label>Nascimento</label><input id="qpD" type="date"></div><div><label>Telefone</label><input id="qpT"></div></div><div class="actions"><button class="btn sec" onclick="closeModal()">Cancelar</button><button class="btn" onclick="saveQuickPac('${c}')">Cadastrar</button></div>`)}
function saveQuickPac(c){const n=$('#qpN').value.trim(),d=$('#qpD').value;if(!n||!d)return;D.pac.push({cpf:c,nome:n,nasc:d,tel:$('#qpT').value,end:'',cad:Date.now()});save();closeModal();showDest()}
function dispFormHtml(){return `<h4>Itens do atendimento</h4><label>📷 Ler código de barras</label><input id="scanOut" class="barcode" placeholder="Bipe e pressione Enter" onkeydown="if(event.key==='Enter'){event.preventDefault();scanSaida(this.value);this.value=''}"><div class="row"><div><label>Ou selecione o item</label><select id="outMed" onchange="updateLots()"><option value="">Selecione…</option>${D.med.slice().sort((a,b)=>a.nome.localeCompare(b.nome)).map(m=>`<option value="${m.id}">${esc(m.nome)} (disp.: ${stock(m.id)})</option>`).join('')}</select></div><div><label>Lote</label><select id="outLot"><option value="">Selecione o item primeiro</option></select></div><div><label>Quantidade</label><input id="outQtd" type="number" min="1" value="1"></div></div><div class="actions"><button class="btn sec" onclick="addCart()">＋ Adicionar</button></div><div id="dispWarn"></div><div id="cartArea">${cartHtml()}</div>`}
function validLots(mid){return D.lotes.filter(l=>l.medId===mid&&l.qtd>0&&new Date(l.validade+'T23:59:59')>=new Date()).sort((a,b)=>new Date(a.validade)-new Date(b.validade))}
function updateLots(){const id=$('#outMed').value,L=validLots(id);$('#outLot').innerHTML=L.length?L.map(l=>`<option value="${l.id}">${esc(l.lote)} — ${l.qtd} un. — val. ${fd(l.validade+'T12:00')}</option>`).join(''):'<option value="">Sem lote disponível</option>';if(ui.dest==='pac'&&id){const w=prazo(dg(ui.cpf),med(id));$('#dispWarn').innerHTML=w?msg('wa','⚠ '+w):''}}
function scanSaida(c){const m=findCod(String(c).trim());if(!m){$('#dispWarn').innerHTML=msg('er','Código não encontrado. Cadastre ou vincule o código na aba Estoque.');return}$('#outMed').value=m.id;updateLots();$('#dispWarn').innerHTML=msg('ok','✔ '+esc(m.nome)+' identificado.')}
function ultima(cpf,mid){return D.mov.filter(x=>x.tipo==='saida'&&x.cpf===cpf&&x.medId===mid).sort((a,b)=>b.data-a.data)[0]}
function prazo(cpf,m){if(!m?.dias)return null;const u=ultima(cpf,m.id);if(!u)return null;const lib=u.data+m.dias*864e5;if(Date.now()<lib)return `Retirada antes do prazo: última em ${fd(u.data)}, próxima prevista para ${fd(lib)}.`;return null}
function addCart(){const mid=$('#outMed').value,lid=$('#outLot').value,q=+$('#outQtd').value,m=med(mid),l=lote(lid);if(!m||!l||q<1){$('#dispWarn').innerHTML=msg('er','Selecione o item, o lote e a quantidade.');return}if(q>l.qtd){$('#dispWarn').innerHTML=msg('er',`Quantidade maior que o saldo do lote (${l.qtd}).`);return}const ex=ui.cart.find(x=>x.loteId===lid);if(ex)ex.qtd+=q;else ui.cart.push({medId:mid,loteId:lid,qtd:q});$('#cartArea').innerHTML=cartHtml();$('#dispWarn').innerHTML=''}
function cartHtml(){if(!ui.cart?.length)return '<p class="hint">Nenhum item adicionado. O sistema usa os lotes válidos e mostra primeiro os que vencem antes.</p>';return `<div class="tw"><table><tr><th>Item</th><th>Lote</th><th>Validade</th><th>Qtd</th><th></th></tr>${ui.cart.map((x,i)=>{const m=med(x.medId),l=lote(x.loteId);return `<tr><td>${esc(m.nome)}</td><td>${esc(l.lote)}</td><td>${fd(l.validade+'T12:00')}</td><td>${x.qtd}</td><td><button class="btn sec sm" onclick="ui.cart.splice(${i},1);$('#cartArea').innerHTML=cartHtml()">Remover</button></td></tr>`}).join('')}</table></div><div class="actions"><button class="btn" onclick="confirmDisp()">Confirmar atendimento (${ui.cart.length} item${ui.cart.length>1?'s':''})</button></div>`}
function confirmDisp(){if(!ui.cart.length)return;for(const x of ui.cart){const l=lote(x.loteId);if(!l||x.qtd>l.qtd){$('#dispRes').innerHTML=msg('er','Saldo de um dos lotes foi alterado. Revise o atendimento.');return}}const pc=ui.dest==='pac',cpf=dg(ui.cpf),at=uid(),antes=[];ui.cart.forEach(x=>{const l=lote(x.loteId),m=med(x.medId),w=pc?prazo(cpf,m):null;l.qtd-=x.qtd;if(w)antes.push(m.nome);D.mov.push({id:uid(),data:Date.now(),tipo:'saida',medId:m.id,loteId:l.id,qtd:x.qtd,atend:at,...(pc?{cpf}:{uni:ui.uni}),...(w?{antecip:1}:{})})});save();const who=pc?pac(cpf).nome:uni(ui.uni).nome;ui.cart=[];showDest();$('#dispRes').innerHTML=msg('ok',`✔ Atendimento registrado para ${esc(who)}.`)+(antes.length?msg('wa','⚠ Retirada antes do prazo: '+esc(antes.join(', '))+'.'):'')}
function vPac(){const q=(ui.q||'').toLowerCase(),qd=dg(q);const l=D.pac.filter(p=>!q||p.nome.toLowerCase().includes(q)||(qd&&p.cpf.includes(qd))).sort((a,b)=>a.nome.localeCompare(b.nome));$('#app').innerHTML=`<div class="card"><h3>Cadastrar paciente</h3><div class="row"><div><label>CPF</label><input id="pCpf" maxlength="14" oninput="this.value=maskCpf(this.value)"></div><div><label>Nome completo</label><input id="pNome"></div><div><label>Nascimento</label><input id="pNasc" type="date"></div><div><label>Telefone</label><input id="pTel"></div><div><label>Endereço / Bairro</label><input id="pEnd"></div></div><div class="actions"><button class="btn" onclick="novoPac()">Cadastrar</button></div><div id="pRes"></div></div><div class="card"><div class="split"><h3>Pacientes (${D.pac.length})</h3><input class="search" placeholder="Pesquisar nome ou CPF…" oninput="ui.q=this.value;vPac()" value="${esc(ui.q||'')}"></div><div class="tw"><table><tr><th>Nome</th><th>CPF</th><th>Nascimento</th><th>Telefone</th><th>Endereço</th><th></th></tr>${l.map(p=>`<tr><td>${esc(p.nome)}</td><td>${fmtCpf(p.cpf)}</td><td>${fd(p.nasc+'T12:00')}</td><td>${esc(p.tel||'—')}</td><td>${esc(p.end||'—')}</td><td><button class="btn sec sm" onclick="editPac('${p.cpf}')">Editar</button> <button class="btn sec sm" onclick="deletePac('${p.cpf}')">Excluir</button></td></tr>`).join('')}</table></div></div>`}
function novoPac(){const c=dg($('#pCpf').value),n=$('#pNome').value.trim(),d=$('#pNasc').value;if(!cpfOk(c)){ $('#pRes').innerHTML=msg('er','CPF inválido.');return}if(!n||!d){$('#pRes').innerHTML=msg('er','Informe nome e data de nascimento.');return}if(pac(c)){ $('#pRes').innerHTML=msg('er','CPF já cadastrado.');return}D.pac.push({cpf:c,nome:n,nasc:d,tel:$('#pTel').value,end:$('#pEnd').value,cad:Date.now()});save();vPac()}
function editPac(c){const p=pac(c);modal(`<h3>Editar paciente</h3><p>CPF: <b>${fmtCpf(c)}</b></p><label>Nome</label><input id="epN" value="${esc(p.nome)}"><div class="row"><div><label>Nascimento</label><input id="epD" type="date" value="${p.nasc}"></div><div><label>Telefone</label><input id="epT" value="${esc(p.tel||'')}"></div></div><label>Endereço / Bairro</label><input id="epE" value="${esc(p.end||'')}"><div class="actions"><button class="btn sec" onclick="closeModal()">Cancelar</button><button class="btn" onclick="savePac('${c}')">Salvar</button></div>`)}
function savePac(c){const p=pac(c);p.nome=$('#epN').value.trim()||p.nome;p.nasc=$('#epD').value;p.tel=$('#epT').value;p.end=$('#epE').value;save();closeModal();vPac()}
async function deletePac(c){if(!(await confirmBox('Excluir este cadastro? O histórico de movimentações será preservado.')))return;D.pac=D.pac.filter(x=>x.cpf!==c);save();vPac()}
function vUni(){$('#app').innerHTML=`<div class="card"><h3>Cadastrar unidade / serviço</h3><div class="row"><div><label>Nome</label><input id="uNome"></div><div><label>CNES (7 dígitos)</label><input id="uCnes" maxlength="7"></div></div><div class="actions"><button class="btn" onclick="novoUni()">Cadastrar</button></div><div id="uRes"></div></div><div class="card"><h3>Unidades cadastradas (${D.uni.length})</h3><div class="tw"><table><tr><th>Nome</th><th>CNES</th><th></th></tr>${D.uni.map(u=>`<tr><td>${esc(u.nome)}</td><td>${esc(u.cnes)}</td><td><button class="btn sec sm" onclick="editUni('${u.id}')">Editar</button> <button class="btn sec sm" onclick="deleteUni('${u.id}')">Excluir</button></td></tr>`).join('')}</table></div></div>`}
function novoUni(){const n=$('#uNome').value.trim(),c=dg($('#uCnes').value);if(!n||c.length!==7){$('#uRes').innerHTML=msg('er','Informe nome e CNES com 7 dígitos.');return}if(D.uni.some(u=>u.cnes===c)){ $('#uRes').innerHTML=msg('er','CNES já cadastrado.');return}D.uni.push({id:uid(),nome:n,cnes:c});save();vUni()}
function editUni(id){const u=uni(id);modal(`<h3>Editar unidade</h3><label>Nome</label><input id="euN" value="${esc(u.nome)}"><label>CNES</label><input id="euC" maxlength="7" value="${u.cnes}"><div class="actions"><button class="btn sec" onclick="closeModal()">Cancelar</button><button class="btn" onclick="saveUni('${id}')">Salvar</button></div>`)}
function saveUni(id){const u=uni(id),c=dg($('#euC').value);if(c.length!==7)return;u.nome=$('#euN').value.trim()||u.nome;u.cnes=c;save();closeModal();vUni()}
async function deleteUni(id){if(!(await confirmBox('Excluir esta unidade? O histórico será preservado.')))return;D.uni=D.uni.filter(x=>x.id!==id);save();vUni()}
function movTable(list){return `<div class="tw"><table><tr><th>Data e hora</th><th>Tipo</th><th>Medicamento</th><th>Quantidade</th><th>Paciente / Destino</th><th>Observação</th></tr>${list.map(x=>{const m=med(x.medId),l=lote(x.loteId);let d=x.tipo==='entrada'?(x.obs||l?.forn||'Fornecedor'):(x.cpf?(pac(x.cpf)?.nome||fmtCpf(x.cpf)):(uni(x.uni)?.nome||'Unidade excluída'));let obs=x.tipo==='entrada'?'Compra':'Dispensação';return `<tr><td>${fdt(x.data)}</td><td><span class="tag ${x.tipo==='entrada'?'info':'good'}">${x.tipo==='entrada'?'Entrada':'Saída'}</span>${x.antecip?' <span class="tag warn">Antes do prazo</span>':''}</td><td>${esc(m?.nome||'Item excluído')}</td><td>${x.qtd}</td><td>${esc(d)}</td><td>${obs}</td></tr>`}).join('')||`<tr><td colspan="6" class="empty">Sem movimentações registradas.</td></tr>`}</table></div>`}
function vHis(){let list=D.mov.slice().sort((a,b)=>b.data-a.data);const t=ui.tipo||'',q=(ui.q||'').toLowerCase();if(t)list=list.filter(x=>x.tipo===t);if(q)list=list.filter(x=>(med(x.medId)?.nome||'').toLowerCase().includes(q)||(lote(x.loteId)?.lote||'').toLowerCase().includes(q));$('#app').innerHTML=`<div class="card"><div class="split"><h3>Histórico de movimentações</h3><div style="display:flex;gap:8px"><select onchange="ui.tipo=this.value;vHis()"><option value="">Todos</option><option value="entrada" ${t==='entrada'?'selected':''}>Entradas</option><option value="saida" ${t==='saida'?'selected':''}>Saídas</option></select><input class="search" placeholder="Item ou lote…" oninput="ui.q=this.value;vHis()" value="${esc(ui.q||'')}"></div></div>${movTable(list)}</div>`}
function relRange(){const end=ui.end||today(),start=ui.start||iso(days(-30));return [new Date(start+'T00:00').getTime(),new Date(end+'T23:59:59').getTime()]}
function relRows(){const [a,b]=relRange();return D.mov.filter(x=>x.data>=a&&x.data<=b&&(!ui.rmed||x.medId===ui.rmed))}
function vRel(){ui.start=ui.start||iso(days(-30));ui.end=ui.end||today();const r=relRows(),ent=r.filter(x=>x.tipo==='entrada'),sai=r.filter(x=>x.tipo==='saida'),sum=a=>a.reduce((s,x)=>s+x.qtd,0);const by={};r.forEach(x=>{const n=med(x.medId)?.nome||'Item excluído';by[n]=by[n]||{e:0,s:0};by[n][x.tipo==='entrada'?'e':'s']+=x.qtd});$('#app').innerHTML=`<div class="card"><h3>Relatórios</h3><div class="row"><div><label>De</label><input type="date" value="${ui.start}" onchange="ui.start=this.value;vRel()"></div><div><label>Até</label><input type="date" value="${ui.end}" onchange="ui.end=this.value;vRel()"></div><div><label>Medicamento / item</label><select onchange="ui.rmed=this.value;vRel()"><option value="">Todos</option>${D.med.map(m=>`<option value="${m.id}" ${ui.rmed===m.id?'selected':''}>${esc(m.nome)}</option>`).join('')}</select></div></div><div class="actions"><button class="btn" onclick="csvRel()">⬇ Exportar CSV</button><button class="btn sec" onclick="window.print()">🖨 Imprimir</button></div></div><div class="grid4"><div class="card kpi"><span>Entradas</span><b>${sum(ent)}</b></div><div class="card kpi"><span>Saídas</span><b>${sum(sai)}</b></div><div class="card kpi"><span>Atendimentos</span><b>${new Set(sai.map(x=>x.atend||x.id)).size}</b></div><div class="card kpi"><span>Pacientes únicos</span><b>${new Set(sai.map(x=>x.cpf).filter(Boolean)).size}</b></div></div><div class="card"><h3>Resumo por item</h3><div class="tw"><table><tr><th>Item</th><th>Entradas</th><th>Saídas</th><th>Saldo disponível</th></tr>${Object.entries(by).sort().map(([n,x])=>`<tr><td>${esc(n)}</td><td>${x.e}</td><td>${x.s}</td><td>${stock(D.med.find(m=>m.nome===n)?.id||'')}</td></tr>`).join('')||`<tr><td colspan="4" class="empty">Sem movimentações no período.</td></tr>`}</table></div></div><div class="card"><h3>Detalhamento</h3>${movTable(r.slice().sort((a,b)=>b.data-a.data))}</div>`}
function csvRel(){const r=relRows();let s='\ufeffData;Tipo;Item;Lote;Quantidade;Destino/Origem\n';r.forEach(x=>{const m=med(x.medId),l=lote(x.loteId);const d=x.tipo==='entrada'?(x.obs||''):(x.cpf?(pac(x.cpf)?.nome||fmtCpf(x.cpf)):(uni(x.uni)?.nome||''));s+=[fdt(x.data),x.tipo,m?.nome||'',l?.lote||'',x.qtd,d].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')+'\n'});download(`relatorio-farmacia-${ui.start}-${ui.end}.csv`,s,'text/csv;charset=utf-8')}
function vBkp(){$('#app').innerHTML=`<div class="grid2"><div class="card"><h3>Exportar backup</h3><p class="hint">Baixe uma cópia JSON dos dados desta demonstração.</p><button class="btn" onclick="download('backup-farmacia-${today()}.json',JSON.stringify(D,null,2),'application/json')">⬇ Baixar backup</button></div><div class="card"><h3>Restaurar / demonstração</h3><label>Importar arquivo JSON</label><input id="bFile" type="file" accept=".json"><div class="actions"><button class="btn" onclick="importBackup()">Restaurar arquivo</button><button class="btn sec" onclick="resetDemo()">Restaurar dados fictícios</button></div><div id="bRes"></div></div></div>`}
function download(name,data,mime){const b=new Blob([data],{type:mime}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importBackup(){const f=$('#bFile').files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!Array.isArray(j.med)||!Array.isArray(j.pac)||!Array.isArray(j.uni)||!Array.isArray(j.lotes)||!Array.isArray(j.mov))throw 0;D=j;save();vBkp();$('#bRes').innerHTML=msg('ok','✔ Backup restaurado e validado.')}catch(e){ $('#bRes').innerHTML=msg('er','Arquivo inválido ou incompatível.')}};r.readAsText(f)}
async function resetDemo(){if(!(await confirmBox('Substituir todos os dados atuais pelos dados fictícios da demonstração?')))return;D=seed();save();vBkp();$('#bRes').innerHTML=msg('ok','✔ Dados fictícios restaurados.')}
render();
</script>
</body>
</html>
